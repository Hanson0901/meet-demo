# Dedicated virtual host for meet.hyang.icu.
# The Let's Encrypt certificate has already been issued by Certbot.
server {
    listen 80;
    listen [::]:80;
    server_name meet.hyang.icu;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name meet.hyang.icu;

    ssl_certificate /etc/letsencrypt/live/meet.hyang.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.hyang.icu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2g;
    client_body_timeout 600s;
    error_page 413 = @meeting_upload_too_large;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_request_buffering off;
        proxy_buffering off;
    }

    location @meeting_upload_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"error":"音訊檔案過大，請使用分段上傳或確認反向代理設定。","code":"payload_too_large"}';
    }
}
