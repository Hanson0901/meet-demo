<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型評估｜會議記憶</title><link rel="stylesheet" href="/evaluation.css"></head>
<body><header class="appbar"><a class="brand" href="/"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 5.5v15M8 7h8M8 10h8M8 13h5"/></svg></span><span><strong>會議記憶</strong><small>MEETING ASSISTANT</small></span></a><nav><a href="/">會議</a><a class="active" href="/evaluate">模型評估</a><a href="/admin">管理</a></nav></header>
<main><section class="page-intro"><p class="overline">MODEL EVALUATION</p><h1>比較會議摘要品質</h1><p>沿用已保存的本地摘要，再透過遠端模型生成摘要與評分。</p></section>
<section class="control-card"><label for="meeting-select">選擇會議</label><div class="control-row"><select id="meeting-select"><option value="">載入會議中…</option></select><button id="run"><svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16M8 15l3-4 3 2 5-7"/></svg>呼叫遠端模型進行比較</button></div><span id="status">先在會議頁完成本地 llama.cpp 分析；此頁只呼叫遠端 API。</span></section>
<aside class="notice"><span class="notice-mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></svg></span><p>分數由 gpt-6-luna 根據逐字稿評估，屬於模型評審估分，不能取代人工標註的客觀準確率。</p></aside>
<section id="result" hidden><div class="result-heading"><div><p class="overline">RESULT</p><h2>評估結果</h2><p id="result-meta" class="muted"></p></div><strong id="winner" class="winner"></strong></div><div class="score-grid"><article class="score-card"><div class="card-head"><span class="model-dot local-dot"></span><h3>本地 llama.cpp</h3></div><div id="local-score"></div></article><article class="score-card"><div class="card-head"><span class="model-dot remote-dot"></span><h3>遠端 gpt-6-luna</h3></div><div id="remote-score"></div></article></div><article class="reason-card"><h3>評審比較</h3><p id="reason"></p></article><div class="summary-grid"><article class="summary-card"><p class="overline">LOCAL MODEL</p><h3>本地模型輸出</h3><div id="local-summary"></div></article><article class="summary-card"><p class="overline">REMOTE MODEL</p><h3>遠端模型輸出</h3><div id="remote-summary"></div></article></div></section>
<section class="history-card"><div class="card-head"><div><p class="overline">HISTORY</p><h2>評估紀錄</h2></div></div><div id="history-list" class="history-list">選擇會議以載入紀錄</div></section></main><script src="/evaluation.js"></script></body></html>
