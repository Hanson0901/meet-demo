<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>資料管理｜會議記憶</title><link rel="stylesheet" href="/admin.css"></head>
<body><header class="appbar"><a class="brand" href="/"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 5.5v15M8 7h8M8 10h8M8 13h5"/></svg></span><span><strong>會議記憶</strong><small>MEETING ASSISTANT</small></span></a><nav><a href="/">會議</a><a href="/evaluate">模型評估</a><a class="active" href="/admin">管理</a></nav></header>
<main><section class="page-intro"><p class="overline">ADMINISTRATION</p><h1>資料管理</h1><p>檢視資料使用量並管理歷史會議記錄。</p></section><section class="security-card"><div class="security-copy"><span class="security-icon"><svg viewBox="0 0 24 24"><path d="M12 3 19 6v5c0 4.5-3 7.5-7 10-4-2.5-7-5.5-7-10V6zM9 12l2 2 4-4"/></svg></span><div><h2>管理員驗證</h2><p>刪除操作會一併清除關聯逐字稿、索引和評估資料。</p></div></div><div class="token-controls"><input id="token" type="password" placeholder="輸入管理員 Token" autocomplete="off"><button id="save-token">儲存 Token</button></div><p id="message" class="status-message">刪除操作無法復原。</p></section>
<section id="stats" class="stats-grid"></section><section class="records-card"><div class="records-heading"><div><p class="overline">RECORDS</p><h2>歷史會議</h2></div><button id="purge" class="danger-button"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg>清除全部資料</button></div><div id="meetings" class="meeting-table"></div></section></main><script src="/admin.js"></script></body></html>
